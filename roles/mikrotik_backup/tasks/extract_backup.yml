# Este arquivo só é incluído (via main.yml) para os hosts que já passaram na
# conectividade, então ansible_play_batch aqui ainda é o lote inteiro
# original - filtra pra mostrar só quem realmente está sendo extraído agora.
- name: "{{ inventory_hostname }} :: extraindo backup deste lote agora"
  ansible.builtin.debug:
    msg: >-
      {%- set active = [] -%}
      {%- for h in ansible_play_batch -%}
        {%- if hostvars[h].mikrotik_backup_status != 'unreachable' -%}
          {%- set _ = active.append(h) -%}
        {%- endif -%}
      {%- endfor -%}
      Extraindo backup agora ({{ active | length }} hosts): {{ active | join(', ') if active else 'nenhum' }}
  run_once: true
  changed_when: true

- name: "{{ inventory_hostname }} :: definir caminhos de saída"
  ansible.builtin.set_fact:
    mikrotik_backup_dir: "{{ backup_root_dir }}/{{ inventory_hostname }}"
    mikrotik_backup_timestamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

- name: "{{ inventory_hostname }} :: garantir diretório de backup"
  ansible.builtin.file:
    path: "{{ mikrotik_backup_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost

- name: "{{ inventory_hostname }} :: obter export de configuração (paramiko local, sem PTY)"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../../scripts/routeros_export.py"
      - --host
      - "{{ ansible_host }}"
      - --port
      - "{{ ansible_port | default(22) }}"
      - --user
      - "{{ ansible_user }}"
      - --timeout
      - "{{ command_timeout_seconds }}"
  delegate_to: localhost
  register: mikrotik_export_result
  ignore_errors: true
  changed_when: false
  no_log: true
  environment:
    MIKROTIK_SSH_PASSWORD: "{{ ansible_password }}"

- name: "{{ inventory_hostname }} :: marcar falha de extração"
  ansible.builtin.set_fact:
    mikrotik_backup_status: backup_failed
    mikrotik_backup_error: "{{ mikrotik_export_result.stderr | default(mikrotik_export_result.msg) | default('Falha ao executar /export via SSH') }}"
  when: mikrotik_export_result is failed

- name: "{{ inventory_hostname }} :: checar backup anterior (latest.rsc)"
  ansible.builtin.stat:
    path: "{{ mikrotik_backup_dir }}/latest.rsc"
  delegate_to: localhost
  register: mikrotik_previous_backup
  when: mikrotik_backup_status != 'backup_failed'

- name: "{{ inventory_hostname }} :: ler conteúdo do backup anterior"
  ansible.builtin.slurp:
    src: "{{ mikrotik_backup_dir }}/latest.rsc"
  delegate_to: localhost
  register: mikrotik_previous_backup_slurp
  when:
    - mikrotik_backup_status != 'backup_failed'
    - mikrotik_previous_backup.stat.exists

- name: "{{ inventory_hostname }} :: normalizar export atual (sem 1a linha, que tem timestamp)"
  ansible.builtin.set_fact:
    mikrotik_new_content_normalized: "{{ mikrotik_export_result.stdout.split('\n')[1:] | join('\n') }}"
  when: mikrotik_backup_status != 'backup_failed'

- name: "{{ inventory_hostname }} :: normalizar export anterior (sem 1a linha)"
  ansible.builtin.set_fact:
    mikrotik_previous_content_normalized: "{{ (mikrotik_previous_backup_slurp.content | b64decode).split('\n')[1:] | join('\n') }}"
  when:
    - mikrotik_backup_status != 'backup_failed'
    - mikrotik_previous_backup.stat.exists

- name: "{{ inventory_hostname }} :: comparar com backup anterior (ignorando linha de data/hora do export)"
  ansible.builtin.set_fact:
    mikrotik_backup_changed: "{{ (not mikrotik_previous_backup.stat.exists) or (mikrotik_previous_content_normalized != mikrotik_new_content_normalized) }}"
  when: mikrotik_backup_status != 'backup_failed'

- name: "{{ inventory_hostname }} :: atualizar 'latest.rsc'"
  ansible.builtin.copy:
    content: "{{ mikrotik_export_result.stdout }}"
    dest: "{{ mikrotik_backup_dir }}/latest.rsc"
    mode: "0644"
  delegate_to: localhost
  when: mikrotik_backup_status != 'backup_failed'

- name: "{{ inventory_hostname }} :: gravar snapshot datado (config mudou)"
  ansible.builtin.copy:
    content: "{{ mikrotik_export_result.stdout }}"
    dest: "{{ mikrotik_backup_dir }}/{{ mikrotik_backup_timestamp }}.rsc"
    mode: "0644"
  delegate_to: localhost
  when:
    - mikrotik_backup_status != 'backup_failed'
    - mikrotik_backup_changed

- name: "{{ inventory_hostname }} :: registrar caminho do backup"
  ansible.builtin.set_fact:
    mikrotik_backup_file: "{{ mikrotik_backup_dir }}/latest.rsc"
  when: mikrotik_backup_status != 'backup_failed'
