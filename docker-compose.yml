services:
  mikrotik-backup:
    build: .
    image: mikrotik-backup:local
    env_file:
      - .env
    volumes:
      - ${BACKUPS_REPO_HOST_DIR:-../mikrotik-data}:/app/data
      - ./cache:/app/cache
      - ${SSH_AUTH_SOCK_HOST_PATH:-/dev/null}:/ssh-agent
      - ${SSH_DEPLOY_KEY_HOST_PATH:-/dev/null}:/app/.ssh/deploy_key:ro
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
    command: ["cron"]
