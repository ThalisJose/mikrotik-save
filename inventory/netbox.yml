plugin: netbox.netbox.nb_inventory
api_endpoint: "{{ lookup('env', 'NETBOX_URL') }}"
token: "{{ lookup('env', 'NETBOX_TOKEN') }}"
validate_certs: "{{ lookup('env', 'NETBOX_VALIDATE_CERTS') | default(true, true) }}"

# Ajuste este filtro para bater com o modelo real de Mikrotiks no seu NetBox.
# Alternativas comuns: device_role, platform, tags. Combine quantos precisar.
query_filters:
  - manufacturer: "mikrotik"

# Campos extras trazidos do NetBox e expostos como hostvars
device_query_filters: []
group_by:
  - device_roles
  - sites
  - tags

compose:
  ansible_host: primary_ip4.address.split('/')[0] if primary_ip4 is defined and primary_ip4 else primary_ip6.address.split('/')[0]
  netbox_device_id: id
  netbox_site: site.slug
  ansible_connection: "'paramiko'"

# Credenciais de SSH de cada device NÃO ficam no NetBox neste desenho:
# use group_vars/host_vars com ansible-vault, indexado por hostname/ID do NetBox.
# Ex.: inventory/group_vars/<nome-do-grupo>.yml ou host_vars/<device>.yml (vault).
